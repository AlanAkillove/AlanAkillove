    <g>
      <rect x="300" y="330" width="220" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
      <text x="410" y="366" font-size="18">AI for Mathematics</text>
    </g>
    <g>
      <rect x="250" y="440" width="320" height="60" rx="10" fill="#eef4ff" stroke="#8c959f"/>
      <text x="410" y="476" font-size="18" font-weight="600">Reliable Research Systems</text>
